
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chingame AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #212121;
  color: #eee;
  display: flex;
  height: 100vh;
}
.sidebar {
  width: 255px;
  background: #171717;
  padding: 22px;
  display: flex;
  flex-direction: column;
}
.logo { font-size: 23px; font-weight: bold; margin-bottom: 30px; }
.new-chat {
  background: #292929;
  border: 1px solid #444;
  color: white;
  padding: 13px;
  border-radius: 9px;
  cursor: pointer;
}
.history { margin-top: 25px; color: #888; font-size: 13px; }
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 25px;
  min-width: 0;
}
.top { width: 100%; color: #aaa; }
.messages {
  flex: 1;
  width: 100%;
  max-width: 800px;
  overflow-y: auto;
  padding: 30px 0;
}
.welcome { text-align: center; margin-top: 110px; }
.welcome h1 { font-size: 35px; }
.welcome p { color: #aaa; }
.message {
  padding: 16px;
  margin: 12px 0;
  border-radius: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
}
.user { background: #303030; }
.ai { background: #252525; }
.input-area {
  width: 100%;
  max-width: 800px;
  padding: 13px;
  background: #303030;
  border: 1px solid #555;
  border-radius: 15px;
  display: flex;
  gap: 10px;
}
input {
  flex: 1;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  font-size: 16px;
  min-width: 0;
}
.send {
  background: white;
  color: black;
  border: none;
  border-radius: 9px;
  padding: 10px 17px;
  cursor: pointer;
}
@media(max-width:600px) {
  .sidebar { width: 70px; padding: 12px 6px; }
  .logo { font-size: 10px; }
  .new-chat { font-size: 10px; padding: 8px 2px; }
  .history { display: none; }
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">Chingame AI</div>
  <button class="new-chat" onclick="newChat()">+ New Chat</button>
  <div class="history">Your personal AI assistant</div>
</aside>

<main class="main">
  <div class="top">Chingame AI</div>
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <h1>Welcome to Chingame AI</h1>
      <p>What can I help you with today?</p>
    </div>
  </div>
  <form class="input-area" id="chatForm">
    <input id="prompt" placeholder="Message Chingame AI..." autocomplete="off">
    <button class="send" type="submit">Send</button>
  </form>
</main>

<script>
const messages = document.getElementById("messages");
const form = document.getElementById("chatForm");
const input = document.getElementById("prompt");

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const prompt = input.value.trim();
  if (!prompt) return;

  document.getElementById("welcome")?.remove();
  addMessage("You", prompt, "user");
  input.value = "";

  addMessage("Chingame AI",
    "Your website interface is working! The AI model still needs to be connected.",
    "ai");
});

function addMessage(name, text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = name + ": " + text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function newChat() {
  messages.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>Welcome to Chingame AI</h1>
      <p>What can I help you with today?</p>
    </div>`;
}
</script>
</body>
</html>
